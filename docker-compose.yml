version: '3.4'

services:

  backend:
    container_name: mymeetings_backend
    build:
      context: ./src/
    ports:
      - "5000:8080"
    networks:
      - starfish-crm-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Meetings_ConnectionStrings__MeetingsConnectionString=Server=mymeetingsdb,1433;Database=MyMeetings;User=sa;Password=Test@12345;Encrypt=False;TrustServerCertificate=True;
      - Meetings_Licenses__MediatR=eyJhbGciOiJSUzI1NiIsImtpZCI6Ikx1Y2t5UGVubnlTb2Z0d2FyZUxpY2Vuc2VLZXkvYmJiMTNhY2I1OTkwNGQ4OWI0Y2IxYzg1ZjA4OGNjZjkiLCJ0eXAiOiJKV1QifQ..jkEXdbMEYOVqbi4JO_pvEIDk5Yd67efLsMqXCDhYGSYYO1-Y9uPLgIDrhEhXsxPSwtQExF5VgIlBM76dolsrbEXCLQYyyzYTSQSmQRASAnUNxIErPhX-IDj2O2SSTfNcaY4HlfM8RTv70Bz8W4NQ5uDvkyYqFdIaRUdk4673sjlpjHNli6mXRyf6T7iZeZ7h9xDe76j7-3u4PWnmLnOG67930PAf_OdgpRCptkVBtPfTOXfx5MnlgzBh1qIVH3LrouSmMDQGph6mBiefksdHsiPezSUE6vEVnhAZvLV709XyNOE6uOFj9cBdqBc3N_NQHQgWevlGzrfR6WiFSx-2Xw
    depends_on:
      - migrator
    restart: on-failure

  mymeetingsdb:
    build: ./src/Database/
    platform: linux/amd64
    ports:
      - 1445:1433
    networks:
      - starfish-crm-network

  migrator:
    container_name: mymeetings_db_migrator
    build:
      context: ./src/
      dockerfile: ./Database/Dockerfile_DatabaseMigrator
    networks:
      - starfish-crm-network
    environment:
      - ASPNETCORE_MyMeetings_IntegrationTests_ConnectionString=Server=mymeetingsdb,1433;Database=MyMeetings;User=sa;Password=Test@12345;Encrypt=False;TrustServerCertificate=True;
    command:
      [
        "./wait-for-it.sh",
        "mymeetingsdb:1433",
        "--timeout=60",
        "--",
        "/bin/bash",
        "/entrypoint_DatabaseMigrator.sh"
      ]
    restart: "no"

networks:
  starfish-crm-network:
